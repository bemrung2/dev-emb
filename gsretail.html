<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>GS리테일(GSR01) 테스트 | EMFI 바로가기</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="card theme-gsr" id="card">
    <a class="back-link" href="index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      바로가기로 돌아가기
    </a>

    <div class="env-switch" role="tablist" aria-label="환경 선택">
      <button type="button" class="env-switch__option" data-env="dev" role="tab" aria-selected="false">
        <span class="env-dot"></span>개발
      </button>
      <button type="button" class="env-switch__option" data-env="staging" role="tab" aria-selected="false">
        <span class="env-dot"></span>스테이징
      </button>
      <button type="button" class="env-switch__option is-active" data-env="prod" role="tab" aria-selected="true">
        <span class="env-dot"></span>운영
      </button>
    </div>
    <p class="env-domain" id="env-domain">emfi.kbstar.com</p>

    <header class="card__header">
      <div class="logo-badge" aria-hidden="true">🏪</div>
      <h1>GS리테일 전용 테스트</h1>
      <p class="subtitle">쿠폰조회 · KB GS Pay 통장 가입 링크를 환경별로 바로 확인해요</p>
    </header>

    <p class="partner-badge">alianCoCd · GSR01</p>

    <div class="shortcut-list">
      <article class="shortcut-item" data-page="C111966">
        <div class="shortcut-item__icon" aria-hidden="true">💳</div>
        <h2 class="shortcut-item__title">KB GS Pay 통장 가입 페이지</h2>
        <p class="shortcut-item__url" id="url-C111966"></p>
        <div class="shortcut-item__actions">
          <a class="shortcut-item__go" id="go-C111966" href="#">이동</a>
          <button type="button" class="shortcut-item__copy" aria-label="URL 복사" title="URL 복사">
            <svg class="icon-copy" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="icon-check" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12l5 5L20 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </article>

      <article class="shortcut-item" data-page="C113919">
        <div class="shortcut-item__icon" aria-hidden="true">🎫</div>
        <h2 class="shortcut-item__title">쿠폰조회 페이지</h2>
        <p class="shortcut-item__url" id="url-C113919"></p>
        <div class="shortcut-item__actions">
          <a class="shortcut-item__go" id="go-C113919" href="#">이동</a>
          <button type="button" class="shortcut-item__copy" aria-label="URL 복사" title="URL 복사">
            <svg class="icon-copy" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="icon-check" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12l5 5L20 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </article>
    </div>
  </main>

  <script src="assets/gsretail.js"></script>

</html>
