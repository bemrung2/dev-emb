<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>EMFI 바로가기</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="card" id="card">
    <div class="env-switch" role="tablist" aria-label="환경 선택">
      <button type="button" class="env-switch__option ripple-surface" data-env="dev" role="tab" aria-selected="false">
        <span class="env-dot"></span>개발
      </button>
      <button type="button" class="env-switch__option ripple-surface" data-env="staging" role="tab" aria-selected="false">
        <span class="env-dot"></span>스테이징
      </button>
      <button type="button" class="env-switch__option ripple-surface is-active" data-env="prod" role="tab" aria-selected="true">
        <span class="env-dot"></span>운영
      </button>
    </div>
    <p class="env-domain" id="env-domain">emfi.kbstar.com</p>

    <header class="card__header">
      <div class="logo-badge" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M9 6H6C4.89543 6 4 6.89543 4 8V18C4 19.1046 4.89543 20 6 20H16C17.1046 20 18 19.1046 18 18V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 4H20V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 4L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>EMFI 바로가기</h1>
      <p class="subtitle" id="subtitle">코드를 입력하면 바로 이동해드려요</p>
    </header>

    <div class="toggle" role="tablist" aria-label="이동 모드 선택">
      <button type="button" class="toggle__option ripple-surface is-active" data-mode="partner" role="tab" aria-selected="true">
        제휴사 코드
      </button>
      <button type="button" class="toggle__option ripple-surface" data-mode="product" role="tab" aria-selected="false">
        상품 목록
      </button>
      <span class="toggle__thumb" aria-hidden="true"></span>
    </div>

    <!-- Mode 1: 제휴사 코드 입력 -->
    <section class="panel is-active" id="panel-partner" role="tabpanel">
      <label class="field-label" for="input-partner">
        제휴사 코드 <span class="required-badge">필수</span>
      </label>
      <input
        id="input-partner"
        class="field__input field__input--mono"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        maxlength="5"
        placeholder="ABC12"
        required
        aria-required="true"
      />
      <p class="field-caption" id="caption-partner">영문 대문자 + 숫자 5자리를 입력하면 해당 제휴사 코드로 이동해요.</p>
    </section>

    <!-- Mode 2: 상품 선택 -->
    <section class="panel" id="panel-product" role="tabpanel">
      <label class="field-label" for="select-product">
        상품 선택 <span class="required-badge">필수</span>
      </label>
      <div class="select-wrap">
        <select id="select-product" required aria-required="true"></select>
        <svg class="select-wrap__chevron" width="14" height="9" viewBox="0 0 14 9" fill="none" aria-hidden="true">
          <path d="M1 1.5L7 7.5L13 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="field-caption">선택한 상품 페이지로 바로 이동해요.</p>

      <div class="product-alert" id="product-alert" role="status">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="product-alert-text">모니모 매일이자 통장은 제휴사 코드 없이, 개발·스테이징 환경에서만 확인할 수 있는 상품이에요. (C111802는 테스트용 페이지예요)</span>
      </div>

      <div class="product-code-group" id="product-code-group">
        <label class="field-label field-label--sub" for="input-product-code">
          제휴사 코드 <span class="optional-badge">선택</span>
        </label>
        <input
          id="input-product-code"
          class="field__input field__input--mono"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          maxlength="5"
          placeholder="KBB01"
        />
        <p class="field-caption" id="caption-product-code">비워두면 기본 코드 <strong>KBB01</strong>로 이동해요.</p>
      </div>
    </section>

    <button type="button" class="go-btn ripple-surface" id="go-btn">
      <span class="go-btn__label">이동하기</span>
      <span class="go-btn__spinner" aria-hidden="true"></span>
    </button>

    <div class="brand-shortcuts">
      <p class="brand-shortcuts__label">제휴사 전용 테스트</p>
      <div class="brand-shortcuts__grid">
        <a class="brand-shortcut brand-shortcut--stb ripple-surface" href="starbucks.html">
          <span class="brand-shortcut__icon" aria-hidden="true">☕</span>
          <span class="brand-shortcut__name">스타벅스</span>
          <span class="brand-shortcut__code">STB01</span>
        </a>
        <a class="brand-shortcut brand-shortcut--gsr ripple-surface" href="gsretail.html">
          <span class="brand-shortcut__icon" aria-hidden="true">🏪</span>
          <span class="brand-shortcut__name">GS리테일</span>
          <span class="brand-shortcut__code">GSR01</span>
        </a>
      </div>
    </div>
  </main>

  <script src="assets/ripple.js"></script>
  <script src="assets/script.js"></script>
</body>
</html>
